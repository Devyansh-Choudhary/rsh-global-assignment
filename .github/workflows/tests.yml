name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt pyflakes
      - name: Lint
        run: python -m pyflakes app.py config.py views src components scripts tests
      - name: Tests (incl. the three historical incidents on the real data)
        run: python -m pytest -q
      - name: Generate the Monday pack
        run: python scripts/generate_reports.py --no-backtest --out /tmp/pack
